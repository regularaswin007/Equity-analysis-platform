<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equity Analysis Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<link rel="stylesheet" href="/static/css/style.css"></head><body><div class="wrap">
<header><div class="logo">Equity Analysis Platform</div>
<div class="bar"><div class="seg" id="mk"><button class="on" data-m="US">US</button><button data-m="NSE">NSE</button><button data-m="BSE">BSE</button></div>
<input id="t" placeholder="Ticker e.g. AAPL, TCS" value="AAPL" autocomplete="off"><button class="go" id="go">Analyze</button></div></header>
<div class="chips" id="hist"></div><div id="err"></div>
<div class="card hero"><div><h1 id="nm">Loading…</h1><div class="sub" id="sb"></div></div>
<div style="text-align:right"><div class="price" id="pr">—</div><span class="pill flat" id="ch">—</span></div></div>
<div class="g4" id="stats"></div>
<div class="card" style="margin-top:14px"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:8px">
<div class="seg" id="pd"><button data-p="1mo">1M</button><button data-p="3mo">3M</button><button data-p="6mo">6M</button><button data-p="1y" class="on">1Y</button><button data-p="5y">5Y</button><button data-p="max">MAX</button></div>
<div id="tgs" style="display:flex;gap:6px;flex-wrap:wrap"></div></div><div id="chart" style="height:760px"></div></div>
<div class="g2"><div class="card"><h3>Technical signals</h3><div id="sig"></div></div>
<div class="card"><h3>News sentiment · FinBERT</h3><div id="gauge" style="height:210px"><div class="ld">Analyzing headlines…</div></div></div></div>
<div class="card"><h3>Fundamentals</h3><div class="fund" id="fund"></div></div>
<div class="card news"><h3>Headlines</h3><div id="news"><div class="ld">Loading…</div></div></div>
<footer>Data: Yahoo Finance, Google News. Educational use only — not investment advice.</footer></div>
<script src="/static/js/format.js"></script>
<script src="/static/js/history.js"></script>
<script src="/static/js/render.js"></script>
<script src="/static/js/chart.js"></script>
<script src="/static/js/news.js"></script>
<script src="/static/js/controls.js"></script>
<script src="/static/js/main.js"></script></body></html>
